name: Moneyway Email Monitor

on:
  schedule:
    # Uruchamia co 5 minut z lekkim przesunięciem (w 2., 7., 12., 17. minucie godziny),
    # aby ominąć największy tłok na serwerach GitHuba o pełnych godzinach
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

jobs:
  check-moneyway:
    runs-on: ubuntu-latest
    # Gotowy obraz Dockera z Playwrightem – skraca czas startu z 40 sek. do ok. 5 sek.
    container:
      image: ://microsoft.com

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Przywrócenie historii kwot z cache
        uses: actions/cache/restore@v4
        with:
          path: historia_kwot.json
          key: moneyway-stan-${{ github.run_id }}
          restore-keys: |
            moneyway-stan-

      - name: Uruchomienie skanera Moneyway
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ODBIORCA_EMAIL: ${{ secrets.ODBIORCA_EMAIL }}
        run: python scanner.py

      - name: Zapisanie zaktualizowanej historii kwot do cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: historia_kwot.json
          key: moneyway-stan-${{ github.run_id }}
