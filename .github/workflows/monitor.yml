name: Moneyway Email Monitor

on:
  workflow_dispatch:

jobs:
  check-moneyway:
    runs-on: ubuntu-latest
    # Gotowy obraz z zainstalowanym Pythonem i Playwrightem (oszczędza ok. 20-30 sekund)
    container:
      image: ://microsoft.com

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Przywrócenie historii kwot z cache
        uses: actions/cache/restore@v4
        with:
          path: historia_kwot.json
          key: moneyway-stan-${{ github.run_id }}
          restore-keys: |
            moneyway-stan-

      - name: Uruchomienie skanera Moneyway
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ODBIORCA_EMAIL: ${{ secrets.ODBIORCA_EMAIL }}
        run: python scanner.py

      - name: Zapisanie zaktualizowanej historii kwot do cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: historia_kwot.json
          key: moneyway-stan-${{ github.run_id }}
