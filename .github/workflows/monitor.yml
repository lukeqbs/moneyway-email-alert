name: Moneyway Web App & Email Monitor

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-moneyway:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sprawdzenie cache przeglądarek Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Instalacja Playwright
        run: |
          pip install playwright
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium
          fi

      - name: Uruchomienie skanera Moneyway
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ODBIORCA_EMAIL: ${{ secrets.ODBIORCA_EMAIL }}
        run: python scanner.py

      - name: Zapisanie wyników do repozytorium
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Moneyway Bot"
          git add dane.json historia_kwot.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aktualizacja danych Moneyway" && git push)
