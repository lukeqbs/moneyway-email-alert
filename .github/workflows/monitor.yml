name: Moneyway Email Monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-moneyway:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sprawdzenie cache przeglądarek Playwright
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Instalacja Playwright i Chromium
        run: |
          pip install playwright
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install chromium
          fi

      - name: Przywrócenie historii kwot z cache
        uses: actions/cache/restore@v4
        with:
          path: historia_kwot.json
          key: moneyway-stan-${{ github.run_id }}
          restore-keys: |
            moneyway-stan-

      - name: Uruchomienie skanera Moneyway
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          ODBIORCA_EMAIL: ${{ secrets.ODBIORCA_EMAIL }}
        run: python scanner.py

      - name: Zapisanie zaktualizowanej historii kwot do cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: historia_kwot.json
          key: moneyway-stan-${{ github.run_id }}
